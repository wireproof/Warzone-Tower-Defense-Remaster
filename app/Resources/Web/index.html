<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; frame-src 'none'"><style>html,body{margin:0;width:100%;height:100%;background:#15120d;overflow:hidden;touch-action:none}body{display:flex;align-items:center;justify-content:center}#game{width:100%;height:100%}ruffle-player{display:block;width:100%;height:100%;touch-action:none}#status{position:absolute;bottom:8px;color:white;font:14px system-ui}</style><script src="lifecycle.js"></script><script src="ruffle.js"></script><script src="touch.js"></script></head><body><div id="game"></div><div id="status">Loading Warzone…</div><script>window.addEventListener('load',async()=>{try{let p=window.RufflePlayer.newest().createPlayer();document.querySelector('#game').appendChild(p);window.WarzoneLifecycle.setPlayer(p);window.WarzoneTouch.attach(p);await p.ruffle().load({url:'game.swf',autoplay:'on',unmuteOverlay:'visible',allowNetworking:'none',allowScriptAccess:false,openUrlMode:'deny',scale:'showAll',forceScale:true,letterbox:'on'});window.WarzoneLifecycle.didLoad();document.querySelector('#status').remove();window.webkit?.messageHandlers?.status?.postMessage('SWF loaded')}catch(e){document.querySelector('#status').textContent='Unable to load game: '+e;window.webkit?.messageHandlers?.status?.postMessage('Load failed: '+e)}})</script></body></html>
